{% extends 'base.html' %}

{% block content %}
<div class="container-fluid mt-5 mb-5">
    <!-- Header Section -->
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="header-title">Attendance for {{ course.code }} - {{ course.name }}</h2>
        </div>
    </div>

    <!-- Attendance Table -->
    <div class="table-container shadow rounded">
        <div class="table-responsive">
            <table class="table table-striped align-middle mb-0" id="attendanceTable">
                <thead class="table-header">
                    <tr>
                        <th scope="col">STUDENT</th>
                        <th scope="col">DATE</th>
                        <th scope="col">STATUS</th>
                        <th scope="col">ROOM</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Back Button -->
    <div class="row mt-4">
        <div class="col-12 text-center">
            <button class="btn btn-outline-primary btn-back" onclick="window.history.back()">Back to Lectures</button>
        </div>
    </div>
</div>

<!-- Custom Styles -->
<style>
    body {
        background-color: #e9f9f5;
        font-family: 'Arial', sans-serif;
    }
    .container-fluid {
        max-width: 1200px;
    }
    .header-title {
        background: linear-gradient(90deg, #1a3c34, #2a5d52);
        color: white;
        padding: 1.5rem;
        border-radius: 10px 10px 0 0;
        margin: 0;
        font-size: 1.75rem;
        font-weight: 500;
        text-align: center;
    }
    .table-container {
        background: white;
        border-radius: 0 0 10px 10px;
        overflow: hidden;
    }
    .table-header {
        background: linear-gradient(90deg, #1a3c34, #2a5d52);
        color: white;
        text-transform: uppercase;
        font-size: 0.9rem;
        font-weight: 600;
    }
    .table-header th {
        padding: 1rem;
        border: none;
    }
    .table td {
        padding: 1rem;
        font-size: 1rem;
        color: #333;
        border: none;
        vertical-align: middle;
    }
    .table-striped tbody tr:nth-of-type(odd) {
        background-color: #f8f8f8;
    }
    .badge {
        font-size: 0.85rem;
        padding: 0.5em 1em;
        border-radius: 20px;
        font-weight: 500;
    }
    .btn-back {
        border: 2px solid #1a3c34;
        color: #1a3c34;
        padding: 0.75rem 2rem;
        font-weight: 500;
        border-radius: 5px;
        transition: all 0.3s ease;
    }
    .btn-back:hover {
        background-color: #1a3c34;
        color: white;
    }
</style>

<!-- JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const attendanceData = [
            { id: 1, student: "John Doe (john.doe)", date: "March 10, 2025", status: "Present", room: "B-101" },
            { id: 2, student: "Jane Smith (jane.smith)", date: "March 10, 2025", status: "Absent", room: "B-101" },
            { id: 3, student: "Mike Johnson (mike.johnson)", date: "March 10, 2025", status: "Late", room: "B-101" },
            { id: 4, student: "Emily Brown (emily.brown)", date: "March 12, 2025", status: "Present", room: "B-102" }
        ];
        const tbody = document.querySelector('#attendanceTable tbody');
        attendanceData.forEach((record, index) => {
            const row = document.createElement('tr');
            const studentCell = document.createElement('td');
            studentCell.textContent = record.student;
            const dateCell = document.createElement('td');
            dateCell.textContent = record.date;
            const statusCell = document.createElement('td');
            const statusBadge = document.createElement('span');
            statusBadge.className = `badge bg-${record.status === 'Present' ? 'success' : record.status === 'Absent' ? 'danger' : 'warning'}`;
            statusBadge.textContent = record.status;
            statusCell.appendChild(statusBadge);
            const roomCell = document.createElement('td');
            roomCell.textContent = record.room;
            row.appendChild(studentCell);
            row.appendChild(dateCell);
            row.appendChild(statusCell);
            row.appendChild(roomCell);
            tbody.appendChild(row);
        });
    });
</script>
{% endblock %}
