{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg leave-card">
        <div class="leave-header text-center">
            <h2><i class="fas fa-feather-alt"></i> Request Leave</h2>
        </div>
        <div class="card-body leave-body">
            <form method="POST" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="row">
                    <!-- Left Column: Subject, Teacher, Leave Date -->
                    <div class="col-lg-6">
                        <div class="mb-4">
                            <label for="id_subject" class="form-label">Subject</label>
                            {{ form.subject }}
                        </div>
                        <div class="mb-4">
                            <label for="id_teacher" class="form-label">Teacher</label>
                            {{ form.teacher }}
                        </div>
                        <div class="mb-4">
                            <label for="id_leave_date" class="form-label">Leave Date</label>
                            <div class="input-group custom-datepicker">
                                {{ form.leave_date }}
                                <span class="input-group-icon"><i class="fas fa-calendar-alt"></i></span>
                            </div>
                            <small class="form-text text-muted">Select a date starting from 2 days ahead.</small>
                        </div>
                    </div>
                    <!-- Right Column: Description -->
                    <div class="col-lg-6">
                        <div class="mb-4 description-container">
                            <label for="id_body" class="form-label">Description</label>
                            <div class="textarea-container">
                                {{ form.body }}
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Submit Button -->
                <button type="submit" class="btn submit-btn w-100">
                    <i class="fas fa-paper-plane"></i> Submit Request
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(145deg, #f0f4f8, #e0e7ff);
        min-height: 100vh;
        justify-content: center;
        align-items: center;
    } 
    .leave-card {
        border: none;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 800px; /* Increased to accommodate two columns */
        margin: auto;
        overflow: hidden;
        transition: transform 0.3s ease;
    }
    .leave-card:hover {
        transform: translateY(-5px);
    }
    .leave-header {
        background: linear-gradient(90deg, #2a4066, #5d8bc2);
        color: #fff;
        padding: 20px;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .leave-body {
        padding: 25px;
        background: #fafafa;
    }
    .form-label {
        font-size: 0.95rem;
        font-weight: 500;
        color: #2a4066;
        margin-bottom: 8px;
    }
    input[type="text"], 
    select {
        border: 1px solid #d1d9e6;
        border-radius: 10px;
        padding: 12px 15px;
        width: 100%;
        font-size: 1rem;
        background: #fff;
        transition: all 0.3s ease;
    }
    input[type="text"]:focus, 
    select:focus {
        border-color: #5d8bc2;
        box-shadow: 0 0 12px rgba(93, 139, 194, 0.3);
        outline: none;
    }
    .textarea-container {
        position: relative;
    }
    textarea {
        border: 1px solid #d1d9e6;
        border-radius: 10px;
        padding: 15px;
        width: 100%;
        font-size: 1rem;
        min-height: 300px; /* Increased to fill column height */
        resize: none;
        background: #fff;
        transition: all 0.3s ease;
    }
    textarea:focus {
        border-color: #5d8bc2;
        box-shadow: 0 0 12px rgba(93, 139, 194, 0.3);
        outline: none;
    }
    .description-container {
        height: 100%; /* Ensure the container fills the column */
        display: flex;
        flex-direction: column;
    }
    .custom-datepicker {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
    }
    .custom-datepicker input[type="date"] {
        border: 1px solid #d1d9e6;
        border-radius: 12px;
        padding: 12px 40px 12px 15px;
        width: 100%;
        font-size: 1rem;
        font-family: 'Poppins', sans-serif;
        background: #fff;
        color: #2a4066;
        cursor: pointer;
        transition: all 0.3s ease;
        appearance: none;
    }
    .custom-datepicker input[type="date"]:focus {
        border-color: #5d8bc2;
        box-shadow: 0 0 12px rgba(93, 139, 194, 0.3);
        outline: none;
    }
    .custom-datepicker .input-group-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #5d8bc2;
        pointer-events: none;
        transition: color 0.3s ease;
    }
    .custom-datepicker input[type="date"]:hover + .input-group-icon,
    .custom-datepicker input[type="date"]:focus + .input-group-icon {
        color: #2a4066;
    }
    .datepicker {
        border-radius: 12px;
        border: none;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        background: #fff;
        padding: 10px;
    }
    .datepicker table tr td.active,
    .datepicker table tr td.active:hover {
        background: linear-gradient(135deg, #5d8bc2, #2a4066);
        color: #fff;
        border-radius: 8px;
    }
    .datepicker table tr td.disabled,
    .datepicker table tr td.disabled:hover {
        background: #f5f5f5;
        color: #ccc;
        cursor: not-allowed;
    }
    .datepicker thead tr:first-child th {
        background: #2a4066;
        color: #fff;
        border-radius: 8px 8px 0 0;
        padding: 10px;
    }
    .datepicker .datepicker-switch:hover,
    .datepicker .prev:hover,
    .datepicker .next:hover {
        background: #5d8bc2;
        color: #fff;
    }
    .submit-btn {
        border-radius: 10px;
        background: linear-gradient(135deg, #2a4066, #5d8bc2);
        color: #fff;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
    }
    .submit-btn:hover {
        background: linear-gradient(135deg, #5d8bc2, #2a4066);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(93, 139, 194, 0.4);
    }
    /* Responsive Adjustments */
    @media (max-width: 991px) {
        .leave-card {
            width: 90%;
            max-width: 500px;
        }
        .leave-header {
            font-size: 1.4rem;
        }
        .submit-btn {
            font-size: 0.9rem;
        }
        .row {
            flex-direction: column;
        }
        .col-lg-6 {
            width: 100%;
        }
        textarea {
            min-height: 150px; /* Reduced for mobile */
        }
    }
</style>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/css/bootstrap-datepicker.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/js/bootstrap-datepicker.min.js"></script>

<script>
    $(document).ready(function () {
        // Get today's date dynamically
        var today = new Date();
        var minDate = new Date(today);
        // Add 2 days to today's date
        minDate.setDate(today.getDate() + 2);
        // Format the date to YYYY-MM-DD
        var minDateFormatted = minDate.toISOString().split('T')[0];
        
        $('#id_leave_date').datepicker({
            format: 'yyyy-mm-dd',
            autoclose: true,
            todayHighlight: true,
            startDate: minDateFormatted,
            orientation: 'bottom auto',
            templates: {
                leftArrow: '<i class="fas fa-chevron-left"></i>',
                rightArrow: '<i class="fas fa-chevron-right"></i>'
            }
        }).on('show', function(e) {
            $('.datepicker').addClass('shadow-lg');
        });
    });
</script>
{% endblock %}
