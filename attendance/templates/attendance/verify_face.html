<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #video {
            border: 2px solid #333;
            border-radius: 8px;
        }
        #canvas {
            display: none;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #457b9d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d3557;
        }
        #message {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Face Authentication</h2>
    <video id="video" width="640" height="480" autoplay></video>
    <canvas id="canvas"></canvas>
    <button id="capture">Capture and Verify</button>
    <div id="message"></div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureButton = document.getElementById('capture');
        const messageDiv = document.getElementById('message');
        const nextUrl = "{{ next }}";

        // Access webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                messageDiv.innerText = 'Error accessing webcam: ' + err;
            });

        // Capture image and send to server
        captureButton.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/jpeg');

            fetch('/attendance/verify-face/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ image: imageData, next: nextUrl })
            })
            .then(response => response.json())
            .then(data => {
                messageDiv.innerText = data.message;
                if (data.status === 'success') {
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                }
            })
            .catch(err => {
                messageDiv.innerText = 'Error: ' + err;
            });
        });
    </script>
</body>
</html>
